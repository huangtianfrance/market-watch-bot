  min_drawdown_from_1y_high_pct: -20.0
  panic_daily_drop_pct: -4.0
  panic_volume_ratio: 1.8
  seller_exhaustion_volume_ratio: 0.8
  buyer_confirmation_daily_pct: 1.0
  buyer_confirmation_volume_ratio: 1.3
  max_candidates_per_email: 4
  principle: "旗舰资产大跌是研究机会，不是自动加仓理由。先区分主动抛售、卖压衰竭和买方确认；只在各自关键基本面未破时分批。"
  groups:
    - name: 美股七姐妹 / Magnificent Seven
      tickers: [AAPL, MSFT, GOOGL, AMZN, META, TSLA, NVDA]
      required_checks: "收入与利润预期、AI回报、核心产品需求、FCF；Tesla额外核对交付、价格战、自动驾驶兑现与融资需求。"
    - name: 存储与HBM龙头 / Memory leaders
      tickers: [000660.KS, 005930.KS, MU]
      required_checks: "HBM份额与定价、DRAM/NAND价格、库存、客户CapEx、毛利率与扩产纪律。"
    - name: AI核心卖铲人 / AI franchise leaders
      tickers: [NVDA, AVGO, MRVL]
      required_checks: "Hyperscaler CapEx、订单/积压订单、定制芯片与网络需求、毛利率、客户集中度和FCF。"
  private_company_manual_watch:
    name: SpaceX
    note: "SpaceX无可靠公开股票代码；只在私募估值显著下修、二级份额折价扩大，或火箭发射/Starlink/政府合同基本面发生重大变化时人工复核，绝不把SPCX等非官方代码当行情。"

market_mover_watch:
  enabled: true
  send_daily_email: true
  external_only: false
  max_rows: 10
  external_max_rows: 5
