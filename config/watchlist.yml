portfolio:
  base_currency: EUR
  alert_timezone: Europe/Paris
  send_email_when_no_alerts: false
  report_mode: alerts_only
  language: zh_en

data_fetch:
  provider: Yahoo Finance via yfinance
  request_pause_seconds: 0.7
  max_retries: 3
  retry_backoff_seconds: 2.0
  stale_after_calendar_days: 7
  min_history_rows: 60
  include_quality_report: true
  include_successful_fetches: false
  note: "Polite pacing, retry with backoff, per-run cache, and data quality reporting."

news_search:
  enabled: true
  provider: GDELT DOC API
  lookback: 14d
  max_red_flags_per_stock: 3
  max_articles_per_stock: 5
  request_pause_seconds: 3.0
  note: "Only checks red flags for triggered rotation targets. Results are evidence prompts, not automatic truth judgments."

influencer_watch:
  enabled: true
  lookback: 7d
  max_articles_per_influencer: 2
  max_rotation_pairs_to_check: 3
  request_pause_seconds: 3.0
  note: "Tracks selected high-performance retail/trading figures. Public-search evidence only; not investment advice."
  people:
    - name: Mark Minervini
      aliases: ["Mark Minervini"]
      background: "从几千美元做到百万级；1997和2021美国投资冠军"
      core_view: "只买最强股票；突破买入；错了立刻止损"
      topic_terms: "stocks OR trading OR market OR ORCL OR Oracle"
    - name: David Ryan
      aliases: ["David Ryan trader", "David Ryan CANSLIM"]
      background: "1985-1987连续三年美国投资冠军"
      core_view: "CANSLIM：盈利增长 + 行业龙头 + 技术突破"
      topic_terms: "stocks OR CANSLIM OR growth stocks OR market"
    - name: Oliver Kell
      aliases: ["Oliver Kell", "Oliver Kell trader"]
      background: "2020美国投资冠军，约+941%"
      core_view: "先判断价格阶段；先设止损；再谈盈利"
      topic_terms: "stocks OR trading OR price action OR market"
    - name: J Law / Judy Lai
      aliases: ["J Law stock", "Judy Lai trader", "J Law Judy Lai"]
      background: "2024美国投资冠军；小资金和大资金组均有数倍收益"
      core_view: "Minervini体系；强势股；集中；纪律"
      topic_terms: "stocks OR trading OR Minervini OR market"
    - name: Keith Gill / Roaring Kitty
      aliases: ["Keith Gill", "Roaring Kitty", "DeepFuckingValue"]
      background: "GameStop成名；散户逆向集中下注代表"
      core_view: "深度研究 + 逆向集中下注；但波动和回撤极高"
      topic_terms: "stocks OR GameStop OR market OR trading"
    - name: Tim Sykes / Ross Cameron
      aliases: ["Tim Sykes", "Ross Cameron", "Warrior Trading"]
      background: "小账户短线交易成名"
      core_view: "小盘股波动；日内交易；严格风控"
      topic_terms: "day trading OR small cap stocks OR trading OR market"

trading_framework:
  enabled: true
  title: "Small-account doubling framework"
  core_principle: "小资金想翻倍，不能只靠低位抄底；要在市场恐慌时买入基本面没死、并且未来可能被重新定价的资产，然后用纪律避免把一次判断错误变成永久亏损。"
  trend_leader_lens: "Minervini / David Ryan: judge the main theme, relative strength, leadership, volume confirmation, and whether the stock is being accumulated by real money."
  contrarian_lens: "Keith Gill: allow contrarian concentration only after deep research, clear mispricing, and a credible re-rating path; do not let one thesis dominate the whole account."
  risk_lens: "Oliver Kell: define invalidation and stop discipline before discussing profit targets; if the thesis breaks, exit instead of averaging down emotionally."
  sizing_note: "For high-volatility ideas, prefer staged entries and small tranches. A signal is a research trigger, not an automatic trade order."

global_rules:
  stock_big_up_daily_pct: 5.0
  stock_big_up_5d_pct: 10.0
  historic_low_lookback_years:
    - 1
    - 3
    - 5
  historic_low_tolerance_pct: 2.0
  confirmed_rerating_daily_pct: 8.0
  confirmed_rerating_5d_pct: 15.0
  confirmed_rerating_volume_ratio_min: 2.0
  rotation_sell_daily_pct: 4.0
  rotation_sell_5d_pct: 8.0
  rotation_buy_5d_drop_pct: -8.0
  rotation_buy_near_low_years: 1
  rotation_buy_near_low_tolerance_pct: 5.0

rotation_engine:
  enabled: true
  max_pairs_per_email: 5
  action_template: "Review trimming a small tranche from the strength candidate and moving it into the opportunity candidate."

